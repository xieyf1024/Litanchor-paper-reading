name: Bug report
description: Report a reproducible LitAnchor failure without sharing private papers or credentials.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload copyrighted PDFs, private Zotero data, Obsidian Vault contents, API keys, or unredacted local paths.
  - type: input
    id: version
    attributes:
      label: LitAnchor version
      placeholder: v0.6.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage
      options:
        - Installation or upgrade
        - Doctor or setup
        - Zotero lookup
        - PDF or MinerU parsing
        - Evidence or note generation
        - Obsidian export
        - Other
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted error text and the smallest reproducible sequence.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Redacted environment
      description: Windows, Python, Zotero and Obsidian versions; omit usernames and private paths.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed private papers, credentials, annotations, usernames and Vault contents.
          required: true
