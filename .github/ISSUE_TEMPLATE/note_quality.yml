name: Note quality problem
description: Report a reproducible fidelity, recall, structure, or visual-selection problem without sharing the paper.
title: "[Quality]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report the general failure pattern, not the paper's answer. Do not upload the PDF, full note, long quotations, private annotations, credentials, usernames, or local paths.
  - type: input
    id: version
    attributes:
      label: LitAnchor version
      placeholder: v0.6.0-beta.3
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Quality category
      options:
        - Unsupported or overstated claim
        - Missing method, result, limitation, formula, or metric
        - Numeric, unit, range, or modality error
        - Wrong paper type or section mapping
        - Figure or table selection problem
        - Note too sparse or repetitive
        - Incorrect missing-information label
        - Other reusable quality problem
    validations:
      required: true
  - type: textarea
    id: general_pattern
    attributes:
      label: Generalized failure pattern
      description: Explain what type of content failed and why the current output is unsafe or unhelpful. Use short redacted paraphrases only.
    validations:
      required: true
  - type: textarea
    id: expected_rule
    attributes:
      label: Expected general behavior
      description: Describe a paper-independent acceptance rule or quality check, not a paper-specific answer.
    validations:
      required: true
  - type: textarea
    id: quality_status
    attributes:
      label: Run status
      description: Reading mode, paper type, page count, fidelity/recall status, and blocker/warning codes only.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and anti-leak confirmation
      options:
        - label: I removed paper identity, answers, long excerpts, generated notes, credentials, usernames, and local paths.
          required: true
        - label: The proposal is reusable across papers and does not hard-code this test case.
          required: true
