name: Installation or lifecycle failure
description: Report a reproducible install, setup, doctor, repair, upgrade, rollback, or uninstall failure.
title: "[Install]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload PDFs, private Zotero data, Obsidian notes, credentials, usernames, or unredacted local paths. Prefer attaching the redacted ZIP created by `litanchor doctor --support-bundle`.
  - type: input
    id: version
    attributes:
      label: LitAnchor version
      placeholder: v1.0.0-rc1
    validations:
      required: true
  - type: dropdown
    id: operation
    attributes:
      label: Failing operation
      options:
        - Install
        - Configure or setup
        - Doctor
        - Repair
        - Upgrade
        - Rollback
        - Uninstall
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Describe the Agent request and the last completed stage. Redact local names and paths.
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: Expected and actual behavior
      description: Include stable error codes when available; do not paste private configuration.
    validations:
      required: true
  - type: input
    id: support_bundle
    attributes:
      label: Redacted support bundle
      description: Drag the ZIP created by doctor here. Review it before uploading.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I reviewed all attachments and removed private papers, notes, credentials, usernames, and local paths.
          required: true
