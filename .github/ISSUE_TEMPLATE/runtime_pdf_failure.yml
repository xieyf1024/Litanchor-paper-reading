name: Runtime or PDF failure
description: Report a Zotero lookup, PDF parsing, MinerU, evidence, figure, or Obsidian export failure.
title: "[Runtime]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Describe the document shape without uploading the paper. Do not share copyrighted PDFs, long excerpts, Zotero data, private notes, credentials, usernames, or unredacted paths.
  - type: input
    id: version
    attributes:
      label: LitAnchor version
      placeholder: v0.6.0-beta.2
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Failing stage
      options:
        - Zotero item or PDF resolution
        - PyMuPDF baseline extraction
        - MinerU structure enhancement
        - Evidence or Claim generation
        - Figure or table handling
        - Quality review
        - Obsidian export
        - Unknown
    validations:
      required: true
  - type: textarea
    id: document_shape
    attributes:
      label: Non-sensitive document characteristics
      description: Page count, approximate file size, native/scanned, one/two columns, and whether it contains formulas or tables. Omit title, DOI, citekey, and excerpts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction and result
      description: Include the last completed stage, stable error code, fallback behavior, and expected behavior.
    validations:
      required: true
  - type: input
    id: support_bundle
    attributes:
      label: Redacted support bundle
      description: Drag the ZIP created by `litanchor doctor --support-bundle` here after reviewing it.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I did not attach the PDF, generated note, evidence excerpts, Zotero data, credentials, or local paths.
          required: true
