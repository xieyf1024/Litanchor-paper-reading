name: Feature request
description: Propose a reusable, paper-independent improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem cannot be solved by the current workflow?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe behavior, not a paper-specific answer.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Reliability and privacy impact
      description: Explain effects on evidence, page verification, uploads, overwrites or permissions.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require paper-specific rules or test-answer leakage.
          required: true
